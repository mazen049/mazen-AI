<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazen AI - Ultimate Edition</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME SETUP
           ========================================================================== */
        :root {
            --bg-main: #09090b;
            --bg-sidebar: rgba(20, 20, 24, 0.85);
            --bg-card: rgba(39, 39, 46, 0.75);
            --bg-hover: rgba(55, 55, 65, 0.9);
            --text-primary: #f4f4f5;
            --text-secondary: #a8c7fa;
            --text-muted: #71717a;
            --accent-gradient: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
            --accent-glow: rgba(155, 114, 203, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================================================
           3. AUTHENTICATION & CAPTCHA OVERLAY (أنا لست روبوت)
           ========================================================================== */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(9, 9, 11, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInMain 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-card {
            background: rgba(25, 25, 35, 0.85);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(66, 133, 244, 0.15);
            text-align: center;
            backdrop-filter: blur(15px);
        }

        .auth-card h2 {
            margin-bottom: 25px;
            font-size: 24px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(15, 15, 18, 0.9);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: #9b72cb;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 15px;
            color: #d4d4d8;
            cursor: pointer;
            text-align: right;
            user-select: none;
        }

        .checkbox-container input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4285f4;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 114, 203, 0.5);
        }

        /* ==========================================================================
           4. DYNAMIC BACKGROUND BLOBS (الأضواء والألوان المتحركة)
           ========================================================================== */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: floatBlob 12s infinite alternate ease-in-out;
            will-change: transform;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: #4285f4;
            top: -15%;
            right: 5%;
        }

        .blob-2 {
            width: 550px;
            height: 550px;
            background: #9b72cb;
            bottom: -15%;
            left: 5%;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 500px;
            height: 500px;
            background: #d96570;
            top: 25%;
            left: 35%;
            animation-delay: -8s;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(80px, -60px) scale(1.25) rotate(180deg);
            }
            100% {
                transform: translate(-70px, 70px) scale(0.85) rotate(360deg);
            }
        }

        /* ==========================================================================
           5. SIDEBAR DESIGN (القائمة الجانبية)
           ========================================================================== */
        aside {
            width: 280px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            z-index: 2;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            animation: slideInSidebar 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInSidebar {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .sidebar-header {
            padding: 20px 15px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn, .clear-btn {
            flex: 1;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 11px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.25s ease;
            text-align: center;
        }

        .new-chat-btn:hover, .clear-btn:hover {
            background: var(--bg-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 14px;
            color: #d4d4d8;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ==========================================================================
           6. MAIN CHAT AREA DESIGN (واجهة المحادثة الرئيسية)
           ========================================================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 2;
            animation: fadeInMain 0.6s ease-out;
        }

        @keyframes fadeInMain {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            background: rgba(20, 20, 24, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 20px;
            font-weight: bold;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            background: var(--accent-gradient);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(155, 114, 203, 0.9);
            animation: pulseLogo 2.2s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(155, 114, 203, 0.8);
            }
            50% {
                transform: scale(1.3);
                box-shadow: 0 0 30px rgba(66, 133, 244, 1);
            }
        }

        .logo-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* ==========================================================================
           7. MESSAGES & FADE-IN ANIMATIONS (الرسائل وتأثيرات الظهور)
           ========================================================================== */
        .message {
            padding: 16px 22px;
            border-radius: 16px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.7;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: messageFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            font-size: 15px;
        }

        @keyframes messageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* سؤال المستخدم -> في اليسار */
        .user-message {
            background: rgba(66, 133, 244, 0.18);
            border: 1px solid rgba(66, 133, 244, 0.35);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #f4f4f5;
        }

        /* جواب المساعد الذكي (AI) -> في اليمين */
        .ai-message {
            background: rgba(30, 30, 38, 0.85);
            border: 1px solid var(--border-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #f4f4f5;
        }

        /* ==========================================================================
           8. TYPING INDICATOR (فقاعة التفكير المتحركة)
           ========================================================================== */
        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 14px 20px;
            background: rgba(30, 30, 38, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            align-self: flex-end;
            animation: messageFadeIn 0.3s ease forwards;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .typing-dot {
            width: 9px;
            height: 9px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: blinkDot 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blinkDot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1.0); opacity: 1; }
        }

        /* ==========================================================================
           9. INPUT AREA (صندوق إدخال الرسائل)
           ========================================================================== */
        #input-container {
            padding: 22px 30px;
            background: rgba(15, 15, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.3);
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 22px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: rgba(25, 25, 32, 0.85);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #9b72cb;
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(30, 30, 38, 0.95);
        }

        button.send-btn {
            padding: 0 32px;
            border: none;
            border-radius: 14px;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(155, 114, 203, 0.5);
        }

        /* ==========================================================================
           10. SCROLLBAR CUSTOMIZATION
           ========================================================================== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       AUTHENTICATION & CAPTCHA HTML
       ========================================================================== -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Mazen AI - Portal</h2>
            <input type="text" id="username-input" class="auth-input" placeholder="أدخل اسم المستخدم أو البريد الإلكتروني">
            <label class="checkbox-container">
                <input type="checkbox" id="not-robot-check">
                أنا لست روبوت (I'm not a robot)
            </label>
            <button class="auth-btn" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- ==========================================================================
       DYNAMIC BACKGROUND BLOBS HTML
       ========================================================================== -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- ==========================================================================
       SIDEBAR HTML
       ========================================================================== -->
    <aside>
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
            <button class="clear-btn" onclick="clearChats()">حذف السجل</button>
        </div>
        <div class="chat-history" id="history-list">
            <div class="history-item">محادثة ترحيبية نشطة</div>
        </div>
    </aside>

    <!-- ==========================================================================
       MAIN CHAT INTERFACE HTML
       ========================================================================== -->
    <main>
        <header>
            <div class="logo-area">
                <div class="logo-dot"></div>
                <span class="logo-text">Mazen AI</span>
            </div>
            <span id="user-display" style="font-size: 14px; color: var(--text-secondary); font-weight: 600;"></span>
        </header>

        <div id="chat-container">
            <div class="message ai-message">أهلاً بك يا صديقي! أنا Mazen AI مصمم خصيصاً لمساعدتك بكل كفاءة وبأعلى جودة ممكنة. كيف يمكنني إفادتك اليوم؟</div>
        </div>

        <div id="input-container">
            <input type="text" id="user-input" placeholder="اسأل Mazen AI أي شيء..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </main>

    <!-- ==========================================================================
       CORE JAVASCRIPT LOGIC
       ========================================================================== -->
    <script>
        // التحقق من حالة تسجيل الدخول عند تحميل الصفحة
        window.onload = function() {
            const loggedUser = localStorage.getItem('mazen_logged_user');
            if (loggedUser) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-display').textContent = 'المستخدم: ' + loggedUser;
            }
        };

        // دالة التعامل مع تسجيل الدخول والتحقق من الروبوت
        function handleLogin() {
            const username = document.getElementById('username-input').value.trim();
            const isChecked = document.getElementById('not-robot-check').checked;

            if (!username) {
                alert('المرجو إدخال اسم المستخدم أو البريد الإلكتروني للمتابعة!');
                return;
            }
            if (!isChecked) {
                alert('المرجو تأكيد أنك لست روبوت عبر تحديد خانة التحقق!');
                return;
            }

            localStorage.setItem('mazen_logged_user', username);
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-display').textContent = 'المستخدم: ' + username;
        }

        // بدء محادثة جديدة وتصفير الشاشة
        function startNewChat() {
            document.getElementById('chat-container').innerHTML = `
                <div class="message ai-message">تم بدء محادثة جديدة بنجاح. تفضل بطرح سؤالك أو موضوعك!</div>
            `;
        }

        // حذف السجل والمحادثات
        function clearChats() {
            if (confirm("هل أنت متأكد من رغبتك في حذف جميع المحادثات وتصفية السجل؟")) {
                startNewChat();
            }
        }

        // دالة إرسال الرسائل والتواصل مع Groq API بالموديل الصحيح والمحدث
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            // 1. عرض سؤال المستخدم في جهة اليسار
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);
            
            // إضافة السجل للقائمة الجانبية كأرشيف سريع
            const historyList = document.getElementById('history-list');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.textContent = text;
            historyList.prepend(historyItem);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. إظهار فقاعة التفكير (Typing Indicator) في جهة اليمين
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.id = 'typing-bubble';
            typingIndicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatContainer.appendChild(typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. جلب مفتاح الأمان والموديل المحدث من الذاكرة المحلية (LocalStorage)
            const groqKey = localStorage.getItem('mazen_groq_key');
            const groqModel = localStorage.getItem('mazen_groq_model') || 'llama-3.3-70b-versatile';

            if (!groqKey) {
                const bubble = document.getElementById('typing-bubble');
                if (bubble) bubble.remove();

                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'تنبيه: المرجو إدخال مفتاح Groq API في المتصفح أولاً لكي يعمل الذكاء الاصطناعي بنجاح!';
                chatContainer.appendChild(errMsg);
                return;
            }

            try {
                // إرسال الطلب لـ Groq API باستخدام الموديل الجديد الصحيح
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${groqKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: groqModel,
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                
                // إزالة فقاعة التفكير
                const bubble = document.getElementById('typing-bubble');
                if (bubble) bubble.remove();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';

                if (data.choices && data.choices.length > 0) {
                    aiMsg.textContent = data.choices[0].message.content;
                } else {
                    aiMsg.textContent = 'خطأ من الخادم: ' + (data.error?.message || 'حاول مرة أخرى لاحقاً');
                }
                chatContainer.appendChild(aiMsg);
            } catch (error) {
                const bubble = document.getElementById('typing-bubble');
                if (bubble) bubble.remove();

                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'حدث خطأ في الاتصال بالشبكة. تأكد من اتصال الإنترنت.';
                chatContainer.appendChild(errMsg);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
