<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZEN AI LIVE</title>
    <!-- مكتبة Google Identity Services لتسجيل الدخول -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }
        .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            margin: 20px auto;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }
        .btn {
            background: #ff4757;
            border: none;
            color: white;
            padding: 12px 22px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.8; }
        .google-btn { background: #4285F4; }
        #output-text {
            margin: 20px auto;
            font-size: 18px;
            color: #00ffff;
            max-width: 600px;
        }
        #user-info {
            margin-bottom: 15px;
            color: #a4b0be;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>MAZEN AI LIVE</h1>
    <p>مكالمة مباشرة - جميع اللغات والأدوات</p>

    <!-- معلومات المستخدم بعد تسجيل الدخول -->
    <div id="user-info">يرجى تسجيل الدخول للبدء</div>

    <!-- زر تسجيل الدخول بـ جوجل (مع إجبار اختيار الحساب) -->
    <button id="google-login-btn" class="btn google-btn">تسجيل الدخول بـ Google (اختيار الحساب)</button>

    <div class="orb"></div>

    <div id="output-text">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>

    <br>
    <button id="download-btn" class="btn">تنزيل المحتوى</button>
    <button id="generate-image-btn" class="btn">توليد صورة بالذكاء الاصطناعي</button>

    <div id="image-output-container" style="margin-top: 20px;"></div>

    <script>
        // 1. تفعيل الصوت عند أول تفاعل
        document.body.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
            }
        }, { once: true });

        // نظام النطق الصوتي
        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 2. إعداد تسجيل الدخول بـ Google مع إجبار ظهور نافذة اختيار الحسابات
        window.onload = function () {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com', // استبدل هاد الكود بـ Client ID ديالك فـ Google Cloud
                    callback: handleCredentialResponse,
                    auto_select_false: true, // منع الدخول التلقائي بدون إذن
                    cancel_on_tap_outside: false
                });

                // ربط زر تسجيل الدخول لإظهار نافذة اختيار الحسابات (Prompt)
                document.getElementById('google-login-btn').addEventListener('click', () => {
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            // طريقة بديلة في حال تم حظر الـ Prompt من المتصفح
                            console.log("Prompt blocked, rendering standard button.");
                        }
                    });
                });
            }
        };

        // دالة استقبال بيانات المستخدم بعد تسجيل الدخول الناجح
        function handleCredentialResponse(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                const user = JSON.parse(jsonPayload);
                document.getElementById('user-info').innerText = `مرحباً بك، ${user.name} (${user.email})_`;
                speakResponse(`أهلاً بك ${user.name}`);
            } catch (error) {
                console.error("Login parsing error:", error);
            }
        }

        // 3. نظام التنزيل الحقيقي
        document.getElementById('download-btn').addEventListener('click', () => {
            const text = document.getElementById('output-text').innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'MazenAI-Output.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        // 4. نظام توليد الصور
        document.getElementById('generate-image-btn').addEventListener('click', () => {
            const container = document.getElementById('image-output-container');
            container.innerHTML = '<p style="color:#00ffff;">جاري توليد الصورة بالذكاء الاصطناعي...</p>';
            
            setTimeout(() => {
                container.innerHTML = '';
                const img = document.createElement('img');
                img.src = 'https://image.pollinations.ai/prompt/Futuristic%20Cyberpunk%20AI%20City';
                img.style.maxWidth = '100%';
                img.style.borderRadius = '12px';
                container.appendChild(img);
                speakResponse("ها هي الصورة وجدات بنجاح!");
            }, 2000);
        });
    </script>
</body>
</html>
