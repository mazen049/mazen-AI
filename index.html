<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazen AI</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-sidebar: rgba(20, 20, 24, 0.75);
            --bg-card: rgba(39, 39, 46, 0.65);
            --bg-hover: rgba(55, 55, 65, 0.8);
            --text-primary: #f4f4f5;
            --text-secondary: #a8c7fa;
            --accent-gradient: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* نافذة تسجيل الدخول والتحقق */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(20px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInMain 0.4s ease-out;
        }
        .auth-card {
            background: rgba(25, 25, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-card h2 {
            margin-bottom: 20px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 15, 18, 0.8);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #a1a1aa;
            cursor: pointer;
            text-align: right;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(155, 114, 203, 0.4);
        }

        /* خلفية الألوان المتحركة */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatBlob 14s infinite alternate ease-in-out;
        }
        .blob-1 { width: 450px; height: 450px; background: #4285f4; top: -10%; right: 15%; }
        .blob-2 { width: 400px; height: 400px; background: #9b72cb; bottom: -10%; left: 10%; animation-delay: -4s; }
        .blob-3 { width: 350px; height: 350px; background: #d96570; top: 40%; left: 45%; animation-delay: -8s; }
        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -50px) scale(1.15); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* القائمة الجانبية */
        aside {
            width: 260px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1;
        }
        .sidebar-header { padding: 15px; display: flex; gap: 10px; }
        .new-chat-btn, .clear-btn {
            flex: 1; background: var(--bg-card); color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px;
            cursor: pointer; font-weight: bold; transition: all 0.25s ease;
        }
        .new-chat-btn:hover, .clear-btn:hover { background: var(--bg-hover); }
        .chat-history { flex: 1; overflow-y: auto; padding: 10px; }

        /* واجهة الشات */
        main {
            flex: 1; display: flex; flex-direction: column; height: 100%; z-index: 1;
            animation: fadeInMain 0.6s ease-out;
        }
        @keyframes fadeInMain { from { opacity: 0; } to { opacity: 1; } }
        header {
            background: rgba(20, 20, 24, 0.6); backdrop-filter: blur(16px);
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 20px; font-weight: bold;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-dot {
            width: 14px; height: 14px; background: var(--accent-gradient); border-radius: 50%;
            box-shadow: 0 0 15px rgba(155, 114, 203, 0.8); animation: pulseLogo 2.5s infinite;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(155, 114, 203, 0.8); }
            50% { transform: scale(1.2); box-shadow: 0 0 25px rgba(66, 133, 244, 1); }
        }
        .logo-text { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #chat-container {
            flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 16px;
        }
        .message {
            padding: 14px 20px; border-radius: 14px; max-width: 75%; word-wrap: break-word; line-height: 1.65;
            backdrop-filter: blur(12px); animation: messageFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(12px);
        }
        @keyframes messageFadeIn { to { opacity: 1; transform: translateY(0); } }
        .user-message {
            background: rgba(66, 133, 244, 0.2); border: 1px solid rgba(66, 133, 244, 0.35);
            align-self: flex-start; border-bottom-right-radius: 4px;
        }
        .ai-message {
            background: rgba(30, 30, 36, 0.75); border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-end; border-bottom-left-radius: 4px;
        }

        #input-container {
            padding: 20px 25px; background: rgba(15, 15, 18, 0.75); backdrop-filter: blur(16px);
            display: flex; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        input[type="text"] {
            flex: 1; padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(25, 25, 30, 0.8); color: var(--text-primary); font-size: 16px; outline: none;
        }
        button.send-btn {
            padding: 0 28px; border: none; border-radius: 12px; background: var(--accent-gradient);
            color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.2s;
        }
        button.send-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول والتحقق -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>تسجيل الدخول - Mazen AI</h2>
            <input type="text" id="username-input" class="auth-input" placeholder="أدخل اسم المستخدم أو البريد">
            <label class="checkbox-container">
                <input type="checkbox" id="not-robot-check">
                أنا لست روبوت (I'm not a robot)
            </label>
            <button class="auth-btn" onclick="handleLogin()">دخول للموقع</button>
        </div>
    </div>

    <!-- خلفية الألوان المتحركة -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- القائمة الجانبية -->
    <aside>
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">+ محادثة جديدة</button>
            <button class="clear-btn" onclick="clearChats()">حذف الكل</button>
        </div>
        <div class="chat-history" id="history-list"></div>
    </aside>

    <!-- واجهة الشات -->
    <main>
        <header>
            <div class="logo-area">
                <div class="logo-dot"></div>
                <span class="logo-text">Mazen AI</span>
            </div>
            <span id="user-display" style="font-size: 14px; color: #a1a1aa;"></span>
        </header>

        <div id="chat-container">
            <div class="message ai-message">أهلاً بك! أنا Mazen AI، جاهز للإجابة على كل أسئلتك.</div>
        </div>

        <div id="input-container">
            <input type="text" id="user-input" placeholder="اسأل Mazen AI أي شيء..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </main>

    <script>
        window.onload = function() {
            const loggedUser = localStorage.getItem('mazen_logged_user');
            if (loggedUser) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-display').textContent = 'مرحباً: ' + loggedUser;
            }
        };

        function handleLogin() {
            const username = document.getElementById('username-input').value.trim();
            const isChecked = document.getElementById('not-robot-check').checked;

            if (!username) {
                alert('المرجو إدخال اسم المستخدم أو البريد!');
                return;
            }
            if (!isChecked) {
                alert('المرجو تأكيد أنك لست روبوت (حدد علامة الصح)!');
                return;
            }

            localStorage.setItem('mazen_logged_user', username);
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-display').textContent = 'مرحباً: ' + username;
        }

        function startNewChat() {
            document.getElementById('chat-container').innerHTML = `
                <div class="message ai-message">تم بدء محادثة جديدة. تفضل بطرح سؤالك!</div>
            `;
        }

        function clearChats() {
            if (confirm("هل أنت متأكد من حذف المحادثات؟")) {
                startNewChat();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const groqKey = localStorage.getItem('mazen_groq_key');
            const groqModel = localStorage.getItem('mazen_groq_model') || 'llama-3.3-70b-versatile';

            if (!groqKey) {
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'المرجو إدخال مفتاح Groq API في المتصفح أولاً!';
                chatContainer.appendChild(errMsg);
                return;
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${groqKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: groqModel,
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';

                if (data.choices && data.choices.length > 0) {
                    aiMsg.textContent = data.choices[0].message.content;
                } else {
                    aiMsg.textContent = 'خطأ من الخادم: ' + (data.error?.message || 'حاول مرة أخرى');
                }
                chatContainer.appendChild(aiMsg);
            } catch (error) {
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'خطأ في الاتصال بالشبكة.';
                chatContainer.appendChild(errMsg);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
