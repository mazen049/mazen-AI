<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content5="width=device-width, initial-scale=1.0">
    <title>MAZEN AI - Professional AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(18, 18, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .glow-purple {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }
        .glow-blue {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">
    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 px-6 glass rounded-2xl glow-purple">
        <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-purple-400 to-blue-500 bg-clip-text text-transparent">MAZEN AI</h1>
        <div class="text-sm text-purple-300 font-medium">By Mazen Errihani</div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full my-8 flex flex-col items-center text-center">
        <div class="glass p-8 rounded-3xl w-full glow-blue">
            <h2 class="text-3xl font-bold mb-4">Welcome to Your AI Workspace</h2>
            <p class="text-gray-400 mb-6">Experience the ultimate futuristic platform with deep black and neon styling.</p>
            <div class="p-4 bg-black/40 rounded-xl border border-purple-500/30 text-purple-200">
                ✨ Ready for Chat, Advanced Tools, and Unlimited Creativity (100% Free & Open Source).
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-xs">
        &copy; 2026 MAZEN AI. All rights reserved.
    </footer>
</body>
</html>
