<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazen AI</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-card: #282a2c;
            --bg-hover: #333537;
            --text-primary: #e3e3e3;
            --text-secondary: #a8c7fa;
            --text-muted: #9aa0a6;
            --accent-gradient: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--bg-sidebar);
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid var(--bg-card);
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .nav-btn {
            background: var(--bg-card);
            color: var(--text-primary);
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 18px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--bg-card);
            align-self: flex-end;
        }
        .ai-message {
            background-color: var(--bg-sidebar);
            align-self: flex-start;
            border: 1px solid var(--bg-card);
        }
        #input-container {
            padding: 15px;
            background-color: var(--bg-sidebar);
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--bg-card);
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--bg-card);
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--text-secondary);
            color: var(--bg-main);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <span>Mazen AI</span>
    </header>

    <div id="chat-container">
        <div class="message ai-message">أهلاً بك! أنا جاهز للإجابة على أسئلتك.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="أَسأل Mazen AI أي شيء...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const groqKey = localStorage.getItem('mazen_groq_key');
            const groqModel = localStorage.getItem('mazen_groq_model') || 'llama-3.3-70b-versatile';

            if (!groqKey) {
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'المرجو إدخال مفتاح Groq API في الإعدادات!';
                chatContainer.appendChild(errMsg);
                return;
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${groqKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: groqModel,
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';

                if (data.choices && data.choices.length > 0) {
                    aiMsg.textContent = data.choices[0].message.content;
                } else {
                    aiMsg.textContent = 'خطأ في الاستجابة من الخادم: ' + (data.error?.message || 'حاول مرة أخرى');
                }
                chatContainer.appendChild(aiMsg);
            } catch (error) {
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.textContent = 'خطأ في الاتصال بالشبكة.';
                chatContainer.appendChild(errMsg);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
